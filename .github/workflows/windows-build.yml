name: Unity Windows Build

on:
  push:
    branches:
      - development

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:2023.2.3f1-base-0 # Use the Linux-compatible Unity editor image

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Activate Unity license
      - name: Activate Unity License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" | base64 -d > Unity_lic.ulf
          mkdir -p ~/.local/share/unity3d/Unity
          mv Unity_lic.ulf ~/.local/share/unity3d/Unity

      # Verify Unity license activation
      - name: Verify License Activation
        run: |
          if [ -f ~/.local/share/unity3d/Unity/Unity_lic.ulf ]; then
            echo "Unity license file exists and was applied successfully."
          else
            echo "License file is missing. Check UNITY_LICENSE in Secrets."
            exit 1
          fi

      # Install dependencies for Wine (required for Windows builds)
      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine32 wine64 xvfb

      # Build the Windows player
      - name: Build Windows Player
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
          /opt/Unity/Editor/Unity \
          -batchmode \
          -quit \
          -projectPath "$(pwd)" \
          -buildTarget Win64 \
          -customBuildTarget StandaloneWindows64 \
          -customBuildPath "./Builds/Windows/MyGame.exe" \
          -logFile /dev/stdout

      # Upload Build Artifacts
      - name: Upload Windows Build
        uses: actions/upload-artifact@v3
        with:
          name: Windows Build
          path: ./Builds/Windows/MyGame.exe
