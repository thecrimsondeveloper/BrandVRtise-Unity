name: Unity Windows Build

on:
  push:
    branches:
      - development

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Download Unity Editor Installer
      - name: Download Unity Editor Installer
        run: |
          curl -o UnitySetup.exe "https://download.unity3d.com/download_unity/8f7c6f9c4d5e/Windows64EditorInstaller/UnitySetup64.exe"

      # Step 3: Install Unity Editor
      - name: Install Unity Editor
        run: |
          .\UnitySetup.exe /S /D=C:\Unity

      # Step 4: Activate Unity License
      - name: Activate Unity License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" | base64 -d > Unity_lic.ulf
          mkdir -p "%LOCALAPPDATA%\Unity"
          move Unity_lic.ulf "%LOCALAPPDATA%\Unity"

      # Step 5: Build Windows Player
      - name: Build Windows Player
        run: |
          C:\Unity\Editor\Unity.exe ^
          -batchmode ^
          -quit ^
          -projectPath "$(pwd)" ^
          -buildTarget Win64 ^
          -customBuildTarget StandaloneWindows64 ^
          -customBuildPath "./Builds/Windows/MyGame.exe" ^
          -logFile ./unity-build.log
