name: Unity Windows Build

on:
  push:
    branches:
      - development

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Chocolatey
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& {
            if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12;
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'));
            } else {
              Write-Host 'Chocolatey is already installed.';
            }
          }"

      - name: Install Unity Hub
        run: |
          choco install unityhub --yes

      - name: Install Unity Editor
        run: |
          "C:\Program Files\Unity Hub\UnityHub.exe" -- --headless install --version 2023.2.3f1 --module windows-mono

      - name: Activate Unity License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$env:UNITY_LICENSE" | base64 -d > Unity_lic.ulf
          mkdir -p "$env:LOCALAPPDATA\Unity"
          move Unity_lic.ulf "$env:LOCALAPPDATA\Unity"

      - name: Build Windows Player
        run: |
          "C:\Program Files\Unity\Hub\Editor\2023.2.3f1\Editor\Unity.exe" ^
          -batchmode ^
          -quit ^
          -projectPath "${{ github.workspace }}" ^
          -buildTarget Win64 ^
          -customBuildTarget StandaloneWindows64 ^
          -customBuildPath "./Builds/Windows/MyGame.exe" ^
          -logFile "$(pwd)/UnityBuild.log"
