name: Unity Windows Build

on:
  push:
    branches:
      - development

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Unity
        run: |
          choco install unityhub --yes
          unityhub install 2023.2.3f1

      - name: Activate Unity License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" | base64 -d > Unity_lic.ulf
          mkdir -p "%LOCALAPPDATA%\Unity"
          move Unity_lic.ulf "%LOCALAPPDATA%\Unity"

      - name: Build Windows Player
        run: |
          Unity.exe \
          -batchmode \
          -quit \
          -projectPath "$(pwd)" \
          -buildTarget Win64 \
          -customBuildTarget StandaloneWindows64 \
          -customBuildPath "./Builds/Windows/MyGame.exe" \
          -logFile /dev/stdout
