name: Build Windows EXE

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:2022.3.30f1-base-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Activate Unity License
        run: |
          echo ${{ secrets.UNITY_LICENSE }} | base64 -d > unity.ulf
          unity-editor \
            -batchmode \
            -manualLicenseFile unity.ulf \
            -logfile /dev/stdout

      - name: Build Windows EXE
        run: |
          unity-editor \
            -batchmode \
            -nographics \
            -logfile /dev/stdout \
            -projectPath ./YourUnityProject \
            -buildTarget StandaloneWindows64 \
            -buildPath ./Builds/WindowsBuild/MyGame.exe
