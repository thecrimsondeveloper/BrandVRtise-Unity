jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step: Debug Home Directory
      - name: Debug Home Directory
        run: |
          echo "Current home directory:"
          ls -alh ~

      # Step: Create Unity License Directory
      - name: Create Unity License Directory
        run: |
          mkdir -p ~/.local/share/unity3d/Unity
          echo "Unity license directory created."

      # Step: Output Unity License
      - name: Output Unity License (Debug Only)
        run: |
          if [ -z "${{ secrets.UNITY_LICENSE }}" ]; then
            echo "UNITY_LICENSE secret is not set!"
            exit 1
          else
            echo "Decoded Unity License:"
            echo "${{ secrets.UNITY_LICENSE }}" | base64 -d || echo "Failed to decode license."
          fi

      # Step: Run Unity Build (Optional Debugging)
      - name: Run Unity Build
        uses: game-ci/unity-builder@v2
        with:
          projectPath: .
          unityVersion: 2023.1.0f1
          targetPlatform: StandaloneWindows64
          buildName: MyUnityBuild
          versioning: Semantic
          dryRun: true # Prevents full build execution for debugging purposes

      # Step: Debug Environment Variables
      - name: Debug Environment Variables
        run: |
          echo "Available environment variables:"
          printenv
