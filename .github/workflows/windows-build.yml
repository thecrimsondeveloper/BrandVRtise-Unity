name: Unity License Debug Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  debug-license:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Unity Editor Version
        run: |
          echo "Using Unity Editor version 6000.0.23f1"
          echo "UNITY_VERSION=6000.0.23f1" >> $GITHUB_ENV

      - name: Install Unity Editor
        uses: game-ci/unity-installer@v2
        with:
          version: 6000.0.23f1

      - name: Create Unity License Directory
        run: mkdir -p ~/.local/share/unity3d/Unity

      - name: Save Unity License File
        run: |
          echo "${{ secrets.UNITY_LICENSE }}" | base64 -d > ~/.local/share/unity3d/Unity/Unity_lic.ulf
          echo "Unity license file saved to ~/.local/share/unity3d/Unity/Unity_lic.ulf"
          ls -alh ~/.local/share/unity3d/Unity

      - name: Debug Unity License File
        run: |
          if [ -f ~/.local/share/unity3d/Unity/Unity_lic.ulf ]; then
            echo "Unity license file exists."
            echo "License file content:"
            cat ~/.local/share/unity3d/Unity/Unity_lic.ulf
          else
            echo "Unity license file is missing!"
          fi

      - name: Debug Environment Variables
        run: |
          echo "Available environment variables:"
          printenv
