name: Unity License Debug Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  debug-license:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Set up Unity Builder
      - name: Unity Builder
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 2022.3.30f1 # Specify Unity version
          projectPath: BrandVRtise # Path to the Unity project folder
          targetPlatform: StandaloneWindows64 # Specify the target platform
          customParameters: -quit -batchmode -nographics # Optional custom Unity parameters
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      # Debug Unity License File
      - name: Debug Unity License File
        run: |
          if [ -f ~/.local/share/unity3d/Unity/Unity_lic.ulf ]; then
            echo "Unity license file exists."
            echo "License file content:"
            cat ~/.local/share/unity3d/Unity/Unity_lic.ulf
          else
            echo "Unity license file is missing!"
          fi

      # Verify Unity Version
      - name: Verify Unity Version
        run: |
          unity-editor --version

      # Check Environment Variables
      - name: Debug Environment Variables
        run: |
          echo "Available environment variables:"
          printenv
