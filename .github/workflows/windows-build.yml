name: Unity Build

on:
  push:
    branches:
      - builds

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Unity Builder
      - name: Unity Builder
        uses: game-ci/unity-builder@v2
        with:
          projectPath: . # Path to your Unity project
          unityVersion: 6000.0.23f1 # Replace with your Unity version
          targetPlatform: StandaloneWindows64 # Replace with your target platform

      # Activate Unity License from the secret
      - name: Activate Unity License
        run: |
          mkdir -p ~/.local/share/unity3d/Unity
          echo "${{ secrets.UNITY_LICENSE }}" > ~/.local/share/unity3d/Unity/Unity_lic.ulf

      # Check if the Unity license file exists
      - name: Check Unity License File Location
        run: |
          echo "Listing contents of the Unity license directory:"
          ls -la ~/.local/share/unity3d/Unity

      # Optional: Upload build artifact
      - name: Upload Build
        uses: actions/upload-artifact@v3
        with:
          name: Build
          path: build/StandaloneWindows64/ # Replace with your build path
