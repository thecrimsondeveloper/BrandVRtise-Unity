name: Unity License Test

on:
  push:
    branches:
      - development

jobs:
  license-test:
    runs-on: windows-latest
    steps:
      #- name: Activate Unity License
      #  env:
      #    UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      #  run: |
      #    echo "$env:UNITY_LICENSE" | base64 -d > Unity_lic.ulf
      #    mkdir -p $env:LOCALAPPDATA\Unity
      #    move Unity_lic.ulf $env:LOCALAPPDATA\Unity

      - name: Download Unity License File
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "Downloading Unity license file..."
          echo "$env:UNITY_LICENSE" > Unity_license.b64
          echo "License file saved as Unity_license.b64."

      - name: Convert License File to ULF
        run: |
          echo "Converting Unity license from Base64 to ULF format..."
          certutil -decode Unity_license.b64 Unity_lic.ulf
          echo "License converted and saved as Unity_lic.ulf."

      - name: Output Decoded ULF File
        run: |
          echo "Decoded Unity license file content:"
          type Unity_lic.ulf
