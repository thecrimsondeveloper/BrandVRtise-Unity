name: Unity Build Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Create Unity License Directory
      - name: Create Unity License Directory
        run: mkdir -p ~/.local/share/unity3d/Unity

      # Step 3: Save Unity License File
      - name: Save Unity License File
        run: |
          echo "${{ secrets.UNITY_LICENSE }}" | base64 -d > ~/.local/share/unity3d/Unity/Unity_lic.ulf
          echo "Unity license file saved to ~/.local/share/unity3d/Unity/Unity_lic.ulf"
          ls -alh ~/.local/share/unity3d/Unity

      # Step 4: Use Unity Builder to build the project
      - name: Build with Unity Builder
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: "6000.0.23f1" # Your Unity version
          targetPlatform: StandaloneLinux64 # Change to your desired platform (e.g., Android, iOS, WebGL, etc.)
          projectPath: BrandVRtise
          customParameters: -buildTarget Linux64 # Add any custom parameters here
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
