name: Unity Build Pipeline

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step: Create Unity License File
      - name: Create Unity License File
        run: |
          mkdir -p ~/.local/share/unity3d/Unity
          echo "${{ secrets.UNITY_LICENSE }}" | base64 -d > ~/.local/share/unity3d/Unity/Unity_lic.ulf

      # Step: Run Unity Build
      - name: Run Unity Build
        uses: game-ci/unity-builder@v2
        with:
          projectPath: .
          unityVersion: 2023.1.0f1
          targetPlatform: StandaloneWindows64
          buildName: MyUnityBuild
          versioning: Semantic

      # Step: Upload Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: UnityBuild
          path: build/*
