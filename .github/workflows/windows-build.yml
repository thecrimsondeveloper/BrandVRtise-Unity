name: Unity Windows Build

on:
  push:
    branches:
      - development

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Unity Hub Manually
        run: |
          Invoke-WebRequest -Uri "https://public-cdn.cloud.unity3d.com/hub/nuo/UnityHubSetup.exe" -OutFile UnityHubSetup.exe
          Start-Process UnityHubSetup.exe -ArgumentList "/S" -NoNewWindow -Wait

      - name: Install Unity Editor Manually
        run: |
          Invoke-WebRequest -Uri "https://download.unity3d.com/download_unity/your_editor_version/UnitySetup64.exe" -OutFile UnitySetup.exe
          Start-Process UnitySetup.exe -ArgumentList "/S /D=C:\Unity" -NoNewWindow -Wait

      - name: Activate Unity License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$env:UNITY_LICENSE" | base64 -d > Unity_lic.ulf
          mkdir -p $env:LOCALAPPDATA\Unity
          move Unity_lic.ulf $env:LOCALAPPDATA\Unity

      - name: Build Windows Player
        run: |
          "C:\Program Files\Unity\Hub\Editor\2023.2.3f1\Editor\Unity.exe" ^
          -batchmode ^
          -quit ^
          -projectPath "${{ github.workspace }}" ^
          -buildTarget Win64 ^
          -customBuildTarget StandaloneWindows64 ^
          -customBuildPath "./Builds/Windows/MyGame.exe" ^
          -logFile "$(pwd)/UnityBuild.log"
