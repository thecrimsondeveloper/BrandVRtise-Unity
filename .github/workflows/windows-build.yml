name: Unity Build Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Decode and save Unity license
      - name: Create Unity License File
        run: |
          echo "${{ secrets.UNITY_LICENSE }}" | base64 -d > Unity_lic.ulf
          mkdir -p ~/.local/share/unity3d/Unity/
          mv Unity_lic.ulf ~/.local/share/unity3d/Unity/

      # Step 3: Debug Unity License
      - name: Debug Unity License File
        run: |
          if [ -f ~/.local/share/unity3d/Unity/Unity_lic.ulf ]; then
            echo "Unity license file exists:"
            cat ~/.local/share/unity3d/Unity/Unity_lic.ulf
          else
            echo "Unity license file is missing!"
          fi

      # Step 4: Build the Unity project
      - name: Build Unity Project
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 2022.3.30f1 # Unity version
          projectPath: BrandVRtise # Path to your Unity project folder
          targetPlatform: StandaloneWindows64 # Build target (e.g., Android, iOS, Windows)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      # Step 5: Verify Unity installation
      - name: Verify Unity Installation
        run: unity-editor --version
