name: Unity Windows Build

on:
  push:
    branches:
      - development

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Download Unity License File
      - name: Download Unity License File
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "Downloading Unity license file..."
          echo "$env:UNITY_LICENSE" > Unity_license.b64
          echo "License file saved as Unity_license.b64."

      # Step 3: Convert License File to ULF
      - name: Convert License File to ULF
        run: |
          echo "Converting Unity license from Base64 to ULF format..."
          certutil -decode Unity_license.b64 Unity_lic.ulf
          echo "License converted and saved as Unity_lic.ulf."

      # Step 4: Output Decoded ULF File (for debugging purposes)
      - name: Output Decoded ULF File
        run: |
          echo "Decoded Unity license file content:"
          type Unity_lic.ulf

      # Step 5: Download Unity Editor
      - name: Download Unity Editor
        run: |
          echo "Downloading Unity Editor..."
          Invoke-WebRequest -Uri "https://download.unity3d.com/download_unity/21747dafc6ee/Windows64EditorInstaller/UnitySetup64-2023.2.3f1.exe" -OutFile UnitySetup.exe
          echo "Unity Editor downloaded successfully."

      # Step 6: Install Unity Editor
      - name: Install Unity Editor
        run: |
          echo "Installing Unity Editor..."
          Start-Process -FilePath UnitySetup.exe -ArgumentList '/S /D=C:\Unity' -NoNewWindow -Wait
          echo "Unity Editor installed successfully."

      # Step 7: Activate Unity License
      - name: Activate Unity License
        run: |
          echo "Activating Unity License..."
          mkdir -p $env:LOCALAPPDATA\Unity
          move Unity_lic.ulf $env:LOCALAPPDATA\Unity
          echo "Unity license activated."

      # Step 8: Build Windows Player
      - name: Build Windows Player
        run: |
          echo "Starting Unity build..."
          "C:\Unity\Editor\Unity.exe" `
          -batchmode `
          -quit `
          -projectPath "${{ github.workspace }}" `
          -buildTarget Win64 `
          -customBuildTarget StandaloneWindows64 `
          -customBuildPath "./Builds/Windows/MyGame.exe" `
          -logFile "$(pwd)/UnityBuild.log"
          echo "Unity build completed successfully."
